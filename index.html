<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LaTeX Renderer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 2em; background: #1a1a1a; color: white; }
    </style>
</head>
<body>
    <div id="math"></div>
    <script>
        window.onload = function() {
            // Получаем LaTeX из параметра 'f' в URL
            const params = new URLSearchParams(window.location.search);
            const formula = params.get('data');
            if (formula) {
                katex.render(formula, document.getElementById('math'), { throwOnError: False });
            }
        };
    </script>
</body>
</html>
